services:
  backend:
    build:
      context: ./backend
    environment:
      DB_URL: sqlite:////data/expense_tracker.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-dev}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VITE_API_BASE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - expense-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  expense-data:
